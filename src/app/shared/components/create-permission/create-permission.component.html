<h4 mat-dialog-title>Create Permission</h4>
<mat-dialog-content class="dialog-content">
  <form [formGroup]="createPermissionForm" class="create-role-form">
    <mat-form-field appearance="outline" label="Slug">
      <input matInput formControlName="slug" />
    </mat-form-field>

    <mat-form-field appearance="outline" label="Title">
      <input matInput formControlName="title" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Close</button>
  <button
    mat-icon-button
    class="icon-btn"
    mat-dialog-close
    [disabled]="!createPermissionForm.valid"
    (click)="createPermissions()"
  >
    Create
    <mat-icon color="secondary">check_circle</mat-icon>
  </button>
</mat-dialog-actions>
